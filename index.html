<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D426 Study</title>
<meta name="description" content="WGU D426 Data Management Foundations: Learn mode, flashcards, practice test, and cram sheet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F5F0; --surface: #FFFFFF; --ink: #1E2124; --muted: #5D6570; --line: #E3DFD6;
  --accent: #0F766E; --accent-ink: #FFFFFF; --accent-soft: #D9EFEB;
  --good: #23784A; --good-soft: #DEF3E5; --bad: #B4410F; --bad-soft: #FBE8DD;
  --mid: #B7791F; --mid-soft: #FBF0D9;
  --focus: #2563EB; --radius: 14px;
  --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121417; --surface: #1B1E23; --ink: #ECEDEE; --muted: #A3A9B2; --line: #2D3239;
    --accent: #3CC7B1; --accent-ink: #0B1F1C; --accent-soft: #15393A;
    --good: #63D493; --good-soft: #163425; --bad: #F39A66; --bad-soft: #3B2519;
    --mid: #E8B45A; --mid-soft: #3A2E17; --focus: #7AA7FF;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.55 var(--font); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 64px; }

/* header */
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 17px; margin-right: auto; white-space: nowrap; }
.brand small { color: var(--muted); font-weight: 400; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 15px; white-space: nowrap; }
.pill.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.streak { font-size: 15px; color: var(--muted); white-space: nowrap; }
.streak b { color: var(--ink); }
nav.tabs { max-width: 760px; margin: 0 auto; padding: 0 16px 10px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { border: 0; background: transparent; padding: 8px 14px; border-radius: 10px; font-weight: 700; color: var(--muted); white-space: nowrap; }
nav.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }

/* topics */
.topics { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 15px; white-space: nowrap; }
@media (max-width: 560px) {
  .topics { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
  .chip { flex: none; }
  .brand small { display: none; }
}
.focusline { margin-top: 16px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 700; }
.hint { color: var(--muted); font-size: 15px; }

/* cards & layout */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin-top: 16px; }
h1, h2, h3 { line-height: 1.25; margin: 0 0 8px; }
h1 { font-size: 26px; } h2 { font-size: 22px; } h3 { font-size: 18px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { justify-content: space-between; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); padding: 12px 20px; border-radius: 12px; font-weight: 700; min-height: 48px; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); font-weight: 400; }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: 15px; }
kbd { font: 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 2px 6px; background: var(--bg); color: var(--muted); }

/* progress */
.prog { height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; display: flex; }
.prog span { display: block; height: 100%; transition: width .4s ease; }
.prog .m { background: var(--good); } .prog .f { background: var(--mid); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin-top: 8px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }

/* question */
.label { text-transform: uppercase; letter-spacing: .06em; font-size: 13px; color: var(--muted); font-weight: 700; }
.prompt { font-size: 24px; line-height: 1.4; margin: 6px 0 20px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 16px; min-height: 56px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-size: 14px; font-weight: 700; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.opt.right { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.opt:disabled:not(.right):not(.wrong) { opacity: .55; }
input.answer { width: 100%; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); font-size: 20px; }
input.answer:focus { border-color: var(--accent); outline: none; }
.fb { margin-top: 16px; padding: 14px 16px; border-radius: 12px; }
.fb.good { background: var(--good-soft); } .fb.bad { background: var(--bad-soft); }
.fb strong { display: block; font-size: 19px; }
.fb .why { color: var(--muted); margin-top: 4px; }
.actions { margin-top: 18px; }

/* flashcards */
.flip { perspective: 1200px; margin-top: 16px; }
.flip-inner { position: relative; min-height: 260px; transition: transform .45s ease; transform-style: preserve-3d; }
.flip.flipped .flip-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; text-align: center; padding: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); font-size: 24px; cursor: pointer; }
.face.back { transform: rotateY(180deg); font-size: 21px; }
.face .tag { position: absolute; top: 14px; left: 18px; }

/* cram */
ol.top { padding-left: 0; list-style: none; counter-reset: n; display: grid; gap: 10px; margin: 0; }
ol.top li { counter-increment: n; display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: start; }
ol.top li::before { content: counter(n); width: 30px; height: 30px; border-radius: 9px; background: var(--accent-soft); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.pair { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.pair:first-child { border-top: 0; }
@media (max-width: 560px) { .pair { grid-template-columns: 1fr; gap: 2px; } .prompt { font-size: 21px; } .face { font-size: 21px; } }

/* summary list */
.slist { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; }
.slist li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-radius: 10px; background: var(--bg); }
.badge { font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; align-self: center; }
.badge.m { background: var(--good-soft); color: var(--good); } .badge.l { background: var(--mid-soft); color: var(--mid); } .badge.x { background: var(--bad-soft); color: var(--bad); }

/* start page */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.tile { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 16px 18px; min-height: 96px; display: grid; align-content: start; gap: 4px; }
.tile:hover { border-color: var(--accent); }
.tile b { font-size: 24px; }
.tile span { color: var(--muted); font-size: 16px; }
@media (max-width: 560px) { .tiles { grid-template-columns: 1fr; } .tile { min-height: 0; } }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; text-align: center; }
.stats div { background: var(--bg); border-radius: 12px; padding: 10px; }
.stats b { display: block; font-size: 24px; }
.stats span { font-size: 14px; color: var(--muted); }
.plan { width: 100%; border-collapse: collapse; margin-top: 10px; }
.plan td { padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
.plan td:first-child { width: 64px; color: var(--muted); white-space: nowrap; }

/* guide */
a { color: var(--accent); }
.mods { display: grid; gap: 10px; margin-top: 16px; }
a.mod { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: inherit; text-decoration: none; }
a.mod:hover { border-color: var(--accent); }
.mod .num { width: 32px; height: 32px; border-radius: 9px; background: var(--accent-soft); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.mod.done .num { background: var(--good-soft); color: var(--good); }
.mod .hint { display: block; }
.doc h1 { font-size: 27px; margin-bottom: 4px; }
.doc h2 { font-size: 21px; margin: 30px 0 10px; }
.doc h3 { margin: 22px 0 8px; }
.doc table { display: block; overflow-x: auto; border-collapse: collapse; font-size: 16px; margin: 12px 0; }
.doc th, .doc td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.doc th { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.doc pre { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; font-size: 14px; line-height: 1.5; }
.doc code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88em; }
.doc :not(pre) > code { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; }
.doc li { margin: 4px 0; }
.callout { border-left: 4px solid; border-radius: 10px; padding: 12px 16px; margin: 16px 0; }
.callout.tip { background: var(--accent-soft); border-color: var(--accent); }
.callout.warning { background: var(--mid-soft); border-color: var(--mid); }
.callout > :first-child { margin-top: 0; } .callout > :last-child { margin-bottom: 0; }
details.check { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 10px 0; background: var(--bg); }
details.check summary { cursor: pointer; font-weight: 700; }
details.check .ans { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
details.check .ans > :first-child { margin-top: 0; } details.check .ans > :last-child { margin-bottom: 0; }
.mermaid { display: flex; justify-content: center; margin: 16px 0; overflow-x: auto; }
.brand a { color: inherit; text-decoration: none; }

/* dialogs */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; z-index: 20; }
.overlay .card { max-width: 460px; width: 100%; margin: 0; }
.pop { animation: pop .35s ease; }
@keyframes pop { 0% { transform: scale(.96); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
details.opts-panel summary { cursor: pointer; color: var(--muted); font-size: 15px; }
.settings { display: grid; gap: 12px; margin-top: 12px; }
.settings label { display: flex; justify-content: space-between; gap: 12px; align-items: center; font-size: 16px; }
.settings select { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
footer { color: var(--muted); font-size: 14px; margin-top: 40px; }
footer a { color: inherit; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><a href="#home">D426 Study</a> <small>Data Management Foundations</small></div>
    <span class="streak" id="streak" aria-live="polite"></span>
    <button class="pill" id="timerBtn" title="Focus sprint timer"></button>
  </div>
  <nav class="tabs" role="tablist" aria-label="Study modes">
    <button role="tab" data-tab="home">Start</button>
    <button role="tab" data-tab="guide">Guide</button>
    <button role="tab" data-tab="learn">Learn</button>
    <button role="tab" data-tab="flash">Flashcards</button>
    <button role="tab" data-tab="test">Practice test</button>
    <button role="tab" data-tab="cram">Cram sheet</button>
  </nav>
</header>
<main class="wrap" id="main"></main>
<div class="sr" aria-live="assertive" id="say"></div>
<script src="data/cards.js"></script>
<script src="data/guide.js"></script>
<script>
(function () {
"use strict";
const D = window.D426;
const main = document.getElementById("main");
if (!D) { main.innerHTML = '<div class="card">Card data did not load. Make sure <code>data/cards.js</code> sits next to this page.</div>'; return; }

/* ---------- storage (never required) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("d426:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("d426:" + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const say = t => { const el = document.getElementById("say"); el.textContent = ""; setTimeout(() => { el.textContent = t; }, 30); };
const topicName = Object.fromEntries(D.topics.map(t => [t.id, t.name]));
const terms = D.terms.map(c => Object.assign({ id: c.t }, c));
const byId = Object.fromEntries(terms.map(c => [c.id, c]));
const PRAISE = ["Nice.", "Got it.", "Yes!", "Locked in.", "Clean.", "That's it.", "Easy.", "Right on."];

/* ---------- state ---------- */
const G = window.D426_GUIDE || [];
const TABS = ["home", "guide", "learn", "flash", "test", "cram"];
const S = {
  tab: TABS.includes(store.get("tab", "home")) ? store.get("tab", "home") : "home",
  mod: null,
  done: store.get("done", {}),
  showPlan: false,
  topics: store.get("topics", []),
  settings: Object.assign({ round: 7, prompt: "def", typed: true, auto: true, front: "term" }, store.get("settings", {})),
  mastery: store.get("mastery", {}),
  streak: 0,
  best: store.get("best", 0)
};
const save = () => { store.set("settings", S.settings); store.set("mastery", S.mastery); store.set("topics", S.topics); store.set("tab", S.tab); };
const scoped = arr => S.topics.length ? arr.filter(x => S.topics.includes(x.topic)) : arr;
const lvl = id => S.mastery[id] || 0;
let L = null, F = null, T = null;

/* ---------- streak ---------- */
function bump(ok) {
  S.streak = ok ? S.streak + 1 : 0;
  if (S.streak > S.best) { S.best = S.streak; store.set("best", S.best); }
  drawStreak();
}
function drawStreak() {
  document.getElementById("streak").innerHTML = S.streak >= 2 ? `<b>${S.streak}</b> in a row` : (S.best ? `Best streak <b>${S.best}</b>` : "");
}

/* ---------- focus timer ---------- */
const TM = { mins: store.get("sprint", 15), end: null, iv: null };
const timerBtn = document.getElementById("timerBtn");
function drawTimer() {
  if (!TM.end) { timerBtn.textContent = `Start ${TM.mins}-min focus`; timerBtn.classList.remove("on"); document.title = "D426 Study"; return; }
  const left = Math.max(0, TM.end - Date.now());
  const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
  const txt = `${m}:${String(s).padStart(2, "0")}`;
  timerBtn.textContent = `${txt} left · stop`;
  timerBtn.classList.add("on");
  document.title = `${txt} · D426 Study`;
  if (left <= 0) { stopTimer(); breakTime(); }
}
function stopTimer() { clearInterval(TM.iv); TM.end = null; drawTimer(); }
function startSprint(mins) {
  TM.mins = mins; store.set("sprint", mins);
  TM.end = Date.now() + mins * 60000; clearInterval(TM.iv); TM.iv = setInterval(drawTimer, 1000); drawTimer();
}
timerBtn.addEventListener("click", () => {
  if (TM.end) { stopTimer(); return; }
  modal(`<h2>Focus sprint</h2><p class="hint">Pick a length. Work until the timer ends, then take a real break.</p>
    <div class="row" style="margin-top:12px">${[10, 15, 25].map(m => `<button class="btn ${m === TM.mins ? "" : "ghost"}" data-min="${m}">${m} min</button>`).join("")}</div>`,
    box => box.querySelectorAll("[data-min]").forEach(b => b.onclick = () => { startSprint(+b.dataset.min); closeModal(); }));
});
function breakTime() {
  modal(`<h2>Sprint done. Break time.</h2>
    <p>You focused for ${TM.mins} minutes. Take 5: stand up, drink water, look at something far away.</p>
    <div class="row actions"><button class="btn" id="again">Start another sprint</button><button class="btn ghost" id="later">Close</button></div>`,
    box => { box.querySelector("#again").onclick = () => { closeModal(); timerBtn.click(); }; box.querySelector("#later").onclick = closeModal; });
}

/* ---------- modal ---------- */
let modalEl = null;
function modal(html, wire) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "overlay";
  modalEl.innerHTML = `<div class="card pop" role="dialog" aria-modal="true">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  if (wire) wire(modalEl);
  const f = modalEl.querySelector("button"); if (f) f.focus();
}
function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } }

/* ---------- tabs & topic chips ---------- */
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab, b.dataset.tab === "guide" ? "" : undefined)));

/* ---------- routing: every view has its own link (#learn, #guide/05-keys-and-constraints) ---------- */
function go(tab, sub) {
  const h = "#" + tab + (sub ? "/" + sub : "");
  if (location.hash !== h) location.hash = h; else route();
}
function route() {
  const [tab, sub] = decodeURIComponent(location.hash.replace(/^#/, "")).split("/");
  if (TABS.includes(tab)) {
    S.tab = tab;
    if (tab === "guide") S.mod = G.some(m => m.id === sub) ? sub : null;
  }
  save(); render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
function chips() {
  const all = !S.topics.length;
  return `<div class="topics" role="group" aria-label="Topics">
    <button class="chip" aria-pressed="${all}" data-topic="">All topics</button>
    ${D.topics.map(t => `<button class="chip" aria-pressed="${S.topics.includes(t.id)}" data-topic="${t.id}">${esc(t.name)}</button>`).join("")}
  </div><div class="hint">Tip: pick one topic at a time. Small chunks stick better.</div>`;
}
function focusLine() {
  const names = S.topics.length ? S.topics.map(t => topicName[t]).join(", ") : "All topics";
  return `<div class="row spread focusline"><span class="hint">Studying: <b style="color:var(--ink)">${esc(names)}</b></span><button class="btn ghost small" id="endsess">End session</button></div>`;
}
function wireEnd(reset) { const b = main.querySelector("#endsess"); if (b) b.onclick = () => { reset(); render(); }; }
function wireChips() {
  main.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => {
    const id = b.dataset.topic;
    if (!id) S.topics = [];
    else S.topics = S.topics.includes(id) ? S.topics.filter(x => x !== id) : S.topics.concat(id);
    L = F = T = null; save(); render();
  });
}

/* ---------- mastery bar ---------- */
function masteryBar(pool) {
  const n = pool.length || 1;
  const m = pool.filter(c => lvl(c.id) >= 2).length, f = pool.filter(c => lvl(c.id) === 1).length;
  return `<div class="prog" role="img" aria-label="${m} mastered, ${f} familiar, ${pool.length - m - f} not started"><span class="m" style="width:${m / n * 100}%"></span><span class="f" style="width:${f / n * 100}%"></span></div>
  <div class="legend"><span><i class="dot" style="background:var(--good)"></i>Mastered ${m}</span><span><i class="dot" style="background:var(--mid)"></i>Familiar ${f}</span><span><i class="dot" style="background:var(--line)"></i>New ${pool.length - m - f}</span></div>`;
}

/* =========================================================
   LEARN  (Quizlet-style: rounds, MC first, then typed)
   ========================================================= */
const typedOn = () => S.settings.typed && S.settings.prompt === "def";
function startRound() {
  const pool = scoped(terms).filter(c => lvl(c.id) < 2);
  if (!pool.length) { L = { finished: true }; render(); return; }
  const inProg = shuffle(pool.filter(c => lvl(c.id) === 1));
  const fresh = shuffle(pool.filter(c => lvl(c.id) === 0));
  const cards = inProg.concat(fresh).slice(0, S.settings.round);
  L = { cards, queue: shuffle(cards), asked: 0, len: cards.length, retry: {}, results: {}, cur: null, round: (L && L.round ? L.round : 0) + 1 };
  nextQ();
}
function options(card) {
  const same = shuffle(terms.filter(c => c.topic === card.topic && c.id !== card.id));
  const other = shuffle(terms.filter(c => c.topic !== card.topic));
  const wrong = same.concat(other).slice(0, 3);

}
function nextQ() {
  if (!L.queue.length) { L.summary = true; L.cur = null; render(); return; }
  const card = L.queue.shift();
  const mode = lvl(card.id) >= 1 && typedOn() ? "type" : "mc";
  L.cur = { card, mode, opts: mode === "mc" ? options(card) : null, done: false, prev: lvl(card.id) };
  L.asked++;

}
function norm(s) { return String(s).toLowerCase().replace(/[^a-z0-9%_]/g, ""); }
function dist(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let p = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; }
  return p[n];
}
function accepted(card) {

}

}
function answer(ok, given) {

  if (ok) { S.mastery[id] = Math.min(2, c.prev + 1); }
  else { S.mastery[id] = 0; if (!L.retry[id]) { L.retry[id] = true; L.queue.push(c.card); L.len++; c.requeued = true; } }
  L.results[id] = lvl(id) >= 2 ? "m" : ok ? "l" : "x";
  bump(ok); save(); render();
  say(ok ? "Correct" : "Incorrect. The answer is " + (S.settings.prompt === "def" ? c.card.t : c.card.d));
  if (ok && S.settings.auto) { const ref = c; setTimeout(() => { if (L && L.cur === ref && S.tab === "learn") nextQ(); }, 1100); }
}
function override() {

function startTest(n, qs) {
  const pool = qs || shuffle(scoped(D.questions));
  const list = pool.slice(0, n || pool.length).map(q => {
    const order = shuffle([0, 1, 2, 3]);
    return { q, order, a: order.indexOf(q.a) };
  });

  render();
}
function renderTest() {
  let h = !T ? chips() : focusLine();
  const pool = scoped(D.questions);
  if (!T) {
    h += `<div class="card"><h1>Practice test</h1><p>Exam-style multiple choice with the answer explained right away. ${pool.length} questions in this selection.</p>
      <div class="row actions">${[10, 20].filter(n => n < pool.length).map(n => `<button class="btn ${n === 10 ? "" : "ghost"}" data-n="${n}">${n} questions</button>`).join("")}<button class="btn ${pool.length <= 10 ? "" : "ghost"}" data-n="0">All ${pool.length}</button></div></div>`;
  } else if (T.i >= T.list.length) {
    const pct = Math.round(T.right / T.list.length * 100);
    h += `<div class="card pop"><div class="label">Results</div><h1>${T.right} / ${T.list.length} (${pct}%)</h1>

      ${T.missed.length ? `<h3 style="margin-top:16px">Review these</h3><ul class="slist">${T.missed.map(m => `<li style="display:block"><div>${esc(m.q.q)}</div><div class="hint">Answer: <b style="color:var(--ink)">${esc(m.q.o[m.q.a])}</b> · ${esc(m.q.e)}</div></li>`).join("")}</ul>` : ""}
      <div class="row actions">${T.missed.length ? `<button class="btn" id="retry">Retry the ${T.missed.length} I missed</button>` : ""}<button class="btn ${T.missed.length ? "ghost" : ""}" id="newtest">New test</button></div></div>`;
  } else {
    const it = T.list[T.i], q = it.q, done = T.picked !== null;
    h += `<div class="card"><div class="row spread"><span class="label">${esc(topicName[q.topic])}</span><span class="hint">${T.i + 1} / ${T.list.length} · ${T.right} right</span></div>
      <div class="prog" style="height:6px;margin:10px 0 14px"><span class="m" style="width:${T.i / T.list.length * 100}%;background:var(--accent)"></span></div>
      <div class="prompt">${esc(q.q)}</div><div class="opts">` +
      it.order.map((oi, i) => {
        let cls = ""; if (done) { if (i === it.a) cls = "right"; else if (i === T.picked) cls = "wrong"; }
        return `<button class="opt ${cls}" data-pick="${i}" ${done ? "disabled" : ""}><span class="k">${i + 1}</span><span>${esc(q.o[oi])}</span></button>`;
      }).join("") + `</div>`;
    if (done) {
      const ok = T.picked === it.a;
      h += `<div class="fb ${ok ? "good" : "bad"} pop"><strong>${ok ? pick(PRAISE) : "Not this time."}</strong><div class="why">${esc(q.e)}</div></div>
        <div class="row actions"><button class="btn" id="tnext">${T.i + 1 < T.list.length ? "Next question" : "See results"}</button><span class="hint"><kbd>Enter</kbd></span></div>`;
    } else h += `<p class="hint" style="margin-top:14px">Press <kbd>1</kbd>–<kbd>4</kbd></p>`;
    h += `</div>`;

  if ($("tnext")) { $("tnext").onclick = () => { T.i++; T.picked = null; render(); }; $("tnext").focus(); }
  if ($("retry")) $("retry").onclick = () => startTest(0, shuffle(T.missed.map(m => m.q)));

}
function testPick(i) {
  if (!T || T.picked !== null) return;

}

}
function renderGuide() {
  if (!G.length) { main.innerHTML = `<div class="card">Guide data did not load. Run <code>python3 tools/build.py</code>.</div>`; return; }
  const short = t => String(t).replace("minutes", "min");
  if (!S.mod) {
    const doneCount = G.filter(x => S.done[x.id]).length, nm = nextModule();
    main.innerHTML = `<div class="card"><h1>Study guide</h1><p style="margin:0">Ten short modules. Same shape every time: <b>TL;DR → details → exam traps → quick check</b>.</p>
      <div class="prog" style="margin-top:14px"><span class="m" style="width:${doneCount / G.length * 100}%"></span></div>
      <p class="hint" style="margin:8px 0 0">${doneCount} of ${G.length} done</p></div>
      <div class="mods">${G.map(x => {
        const pool = terms.filter(c => c.topic === x.topic), mm = pool.filter(c => lvl(c.id) >= 2).length;
        const tag = S.done[x.id] ? `<span class="badge m">Done</span>` : x === nm ? `<span class="badge l">Next up</span>` : "";
        return `<a class="mod ${S.done[x.id] ? "done" : ""}" href="#guide/${x.id}"><span class="num">${S.done[x.id] ? "✓" : x.n}</span><span><b>${esc(x.title)}</b><span class="hint">${short(x.time)} · ${mm}/${pool.length} terms mastered</span></span>${tag}</a>`;
      }).join("")}</div>`;
    return;
  }
  const i = G.findIndex(x => x.id === S.mod), x = G[i], prev = G[i - 1], next = G[i + 1];
  main.innerHTML = `<div class="row spread" style="margin-top:16px"><a class="btn ghost small" href="#guide" style="text-decoration:none">← All modules</a><span class="hint">Module ${x.n} of ${G.length} · ${short(x.time)}</span></div>
    <article class="card doc"><h1>${esc(x.title)}</h1>${x.html}</article>
    <div class="card"><div class="row">
      <button class="btn ${S.done[x.id] ? "ghost" : ""}" id="mdone">${S.done[x.id] ? "✓ Done (undo)" : "Mark done"}</button>
      <button class="btn ${S.done[x.id] ? "" : "ghost"}" id="mpractice">Practice ${esc(topicName[x.topic])} in Learn →</button>
    </div></div>
    <div class="row spread" style="margin-top:16px">${prev ? `<a href="#guide/${prev.id}">← ${esc(prev.title)}</a>` : "<span></span>"}${next ? `<a href="#guide/${next.id}">${esc(next.title)} →</a>` : `<a href="#cram">Cram sheet →</a>`}</div>`;
  main.querySelector("#mdone").onclick = () => { S.done[x.id] = !S.done[x.id]; if (!S.done[x.id]) delete S.done[x.id]; store.set("done", S.done); render(); };
  main.querySelector("#mpractice").onclick = () => { S.topics = [x.topic]; L = F = T = null; save(); go("learn"); };
  drawDiagrams();
}

/* ---------- render ---------- */
function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
  ({ home: renderHome, guide: renderGuide, learn: renderLearn, flash: renderFlash, test: renderTest, cram: renderCram }[S.tab] || renderHome)();
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeModal(); return; }
  if (modalEl || e.metaKey || e.ctrlKey || e.altKey) return;
  const inInput = e.target.tagName === "INPUT" || e.target.tagName === "SELECT";
  const num = /^[1-4]$/.test(e.key) ? +e.key - 1 : -1;
  if (S.tab === "learn") {
    if (!L) { if (e.key === "Enter" && !inInput && e.target.tagName !== "BUTTON" && e.target.tagName !== "SUMMARY") { e.preventDefault(); startRound(); } return; }
    if (L.summary) { if (e.key === "Enter" && e.target.tagName !== "BUTTON") { e.preventDefault(); startRound(); } return; }
    const c = L.cur; if (!c) return;
    if (!c.done && c.mode === "mc" && num >= 0 && !inInput) { e.preventDefault(); const o = c.opts[num]; answer(o.id === c.card.id, o.id); }
    else if (!c.done && c.mode === "type" && e.key === "Enter" && inInput) { e.preventDefault(); submitTyped(); }
    else if (c.done && e.key === "Enter" && e.target.tagName !== "BUTTON") { e.preventDefault(); nextQ(); }
  } else if (S.tab === "flash" && F && F.i < F.ids.length && !inInput) {
    if (e.key === " ") { e.preventDefault(); F.flipped = !F.flipped; const el = main.querySelector("#flip"); if (el) el.classList.toggle("flipped", F.flipped); }
    else if (e.key === "1") flashMark(false);
    else if (e.key === "2") flashMark(true);
    else if (e.key === "ArrowRight") { F.i = Math.min(F.ids.length, F.i + 1); F.flipped = false; render(); }
    else if (e.key === "ArrowLeft") { F.i = Math.max(0, F.i - 1); F.flipped = false; render(); }
  } else if (S.tab === "test" && T && T.i < T.list.length && !inInput) {
    if (T.picked === null && num >= 0) { e.preventDefault(); testPick(num); }
    else if (T.picked !== null && e.key === "Enter" && e.target.tagName !== "BUTTON") { e.preventDefault(); T.i++; T.picked = null; render(); }
  }
});

drawTimer(); drawStreak();
if (location.hash.length > 1) route(); else render();
})();
</script>
</body>
</html>
