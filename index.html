<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D426 Study</title>
<meta name="description" content="WGU D426 Data Management Foundations: Learn mode, flashcards, practice test, and cram sheet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F5F0; --surface: #FFFFFF; --ink: #1E2124; --muted: #5D6570; --line: #E3DFD6;
  --accent: #0F766E; --accent-ink: #FFFFFF; --accent-soft: #D9EFEB;
  --good: #23784A; --good-soft: #DEF3E5; --bad: #B4410F; --bad-soft: #FBE8DD;
  --mid: #B7791F; --mid-soft: #FBF0D9;
  --focus: #2563EB; --radius: 14px; --red: #C62828;
  --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121417; --surface: #1B1E23; --ink: #ECEDEE; --muted: #A3A9B2; --line: #2D3239;
    --accent: #3CC7B1; --accent-ink: #0B1F1C; --accent-soft: #15393A;
    --good: #63D493; --good-soft: #163425; --bad: #F39A66; --bad-soft: #3B2519;
    --mid: #E8B45A; --mid-soft: #3A2E17; --focus: #7AA7FF; --red: #FF6B5B;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.55 var(--font); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 64px; }

/* header */
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 17px; margin-right: auto; white-space: nowrap; }
.brand small { color: var(--muted); font-weight: 400; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 15px; white-space: nowrap; }
.pill.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.streak { font-size: 15px; color: var(--muted); white-space: nowrap; }
.streak b { color: var(--ink); }
nav.tabs { max-width: 760px; margin: 0 auto; padding: 0 16px 10px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { border: 0; background: transparent; padding: 8px 14px; border-radius: 10px; font-weight: 700; color: var(--muted); white-space: nowrap; }
nav.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }

/* topics */
.topics { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 15px; white-space: nowrap; }
@media (max-width: 560px) {
  .topics { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
  .chip { flex: none; }
  .brand small { display: none; }
}
.focusline { margin-top: 16px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 700; }
.hint { color: var(--muted); font-size: 15px; }

/* cards & layout */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin-top: 16px; }
h1, h2, h3 { line-height: 1.25; margin: 0 0 8px; }
h1 { font-size: 26px; } h2 { font-size: 22px; } h3 { font-size: 18px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { justify-content: space-between; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); padding: 12px 20px; border-radius: 12px; font-weight: 700; min-height: 48px; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); font-weight: 400; }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: 15px; }
kbd { font: 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 2px 6px; background: var(--bg); color: var(--muted); }

/* progress */
.prog { height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; display: flex; }
.prog span { display: block; height: 100%; transition: width .4s ease; }
.prog .m { background: var(--good); } .prog .f { background: var(--mid); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin-top: 8px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }

/* question */
.label { text-transform: uppercase; letter-spacing: .06em; font-size: 13px; color: var(--muted); font-weight: 700; }
.prompt { font-size: 24px; line-height: 1.4; margin: 6px 0 20px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 16px; min-height: 56px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-size: 14px; font-weight: 700; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.opt.right { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.opt:disabled:not(.right):not(.wrong) { opacity: .55; }
input.answer { width: 100%; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); font-size: 20px; }
input.answer:focus { border-color: var(--accent); outline: none; }
.fb { margin-top: 16px; padding: 14px 16px; border-radius: 12px; }
.fb.good { background: var(--good-soft); } .fb.bad { background: var(--bad-soft); }
.fb strong { display: block; font-size: 19px; }
.fb .why { color: var(--muted); margin-top: 4px; }
.actions { margin-top: 18px; }

/* flashcards */
.flip { perspective: 1200px; margin-top: 16px; }
.flip-inner { position: relative; min-height: 260px; transition: transform .45s ease; transform-style: preserve-3d; }
.flip.flipped .flip-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; text-align: center; padding: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); font-size: 24px; cursor: pointer; }
.face.back { transform: rotateY(180deg); font-size: 21px; }
.face .tag { position: absolute; top: 14px; left: 18px; }

/* cram */
ol.top { padding-left: 0; list-style: none; counter-reset: n; display: grid; gap: 10px; margin: 0; }
ol.top li { counter-increment: n; display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: start; }
ol.top li::before { content: counter(n); width: 30px; height: 30px; border-radius: 9px; background: var(--accent-soft); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.pair { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.pair:first-child { border-top: 0; }
@media (max-width: 560px) { .pair { grid-template-columns: 1fr; gap: 2px; } .prompt { font-size: 21px; } .face { font-size: 21px; } }

/* summary list */
.slist { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; }
.slist li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-radius: 10px; background: var(--bg); }
.badge { font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; align-self: center; }
.badge.m { background: var(--good-soft); color: var(--good); } .badge.l { background: var(--mid-soft); color: var(--mid); } .badge.x { background: var(--bad-soft); color: var(--bad); }

/* start page */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.tile { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 16px 18px; min-height: 96px; display: grid; align-content: start; gap: 4px; }
.tile:hover { border-color: var(--accent); }
.tile b { font-size: 24px; }
.tile span { color: var(--muted); font-size: 16px; }
@media (max-width: 560px) { .tiles { grid-template-columns: 1fr; } .tile { min-height: 0; } }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; text-align: center; }
.stats div { background: var(--bg); border-radius: 12px; padding: 10px; }
.stats b { display: block; font-size: 24px; }
.stats span { font-size: 14px; color: var(--muted); }
.plan { width: 100%; border-collapse: collapse; margin-top: 10px; }
.plan td { padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
.plan td:first-child { width: 64px; color: var(--muted); white-space: nowrap; }

/* guide */
a { color: var(--accent); }
.mods { display: grid; gap: 10px; margin-top: 16px; }
a.mod { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: inherit; text-decoration: none; }
a.mod:hover { border-color: var(--accent); }
.mod .num { width: 32px; height: 32px; border-radius: 9px; background: var(--accent-soft); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.mod.done .num { background: var(--good-soft); color: var(--good); }
.mod .hint { display: block; }
.doc h1 { font-size: 27px; margin-bottom: 4px; }
.doc h2 { font-size: 21px; margin: 30px 0 10px; }
.doc h3 { margin: 22px 0 8px; }
.doc table { display: block; overflow-x: auto; border-collapse: collapse; font-size: 16px; margin: 12px 0; }
.doc th, .doc td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.doc th { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.doc pre { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; font-size: 14px; line-height: 1.5; }
.doc code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88em; }
.doc :not(pre) > code { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; }
.doc li { margin: 4px 0; }
.callout { border-left: 4px solid; border-radius: 10px; padding: 12px 16px; margin: 16px 0; }
.callout.tip { background: var(--accent-soft); border-color: var(--accent); }
.callout.warning { background: var(--mid-soft); border-color: var(--mid); }
.callout > :first-child { margin-top: 0; } .callout > :last-child { margin-bottom: 0; }
details.check { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 10px 0; background: var(--bg); }
details.check summary { cursor: pointer; font-weight: 700; }
details.check .ans { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
details.check .ans > :first-child { margin-top: 0; } details.check .ans > :last-child { margin-bottom: 0; }
.mermaid { display: flex; justify-content: center; margin: 16px 0; overflow-x: auto; }
.mermaid .label { text-transform: none; letter-spacing: normal; font-size: inherit; font-weight: 400; color: inherit; }
.brand a { color: inherit; text-decoration: none; }

/* competencies tab (red text doc) */
.redtext .red { color: var(--red); font-weight: 700; font-size: 21px; line-height: 1.35; margin: 18px 0 4px; }
.redtext ul { margin: 0; padding-left: 24px; }
.split { display: flex; height: 40px; border-radius: 10px; overflow: hidden; margin: 16px 0 6px; border: 1px solid var(--line); }
.split span { display: grid; place-items: center; font-weight: 700; font-size: 15px; color: var(--ink); border-right: 2px solid var(--surface); }
.split span:last-child { border-right: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.tag { font-size: 14px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px; }
.tag:hover { border-color: var(--accent); }
.ctitle { color: var(--red); }

/* study buddy */
.fab { position: fixed; right: 16px; bottom: 16px; z-index: 15; border: 0; border-radius: 999px; padding: 12px 22px; min-height: 52px; background: var(--ink); color: var(--bg); font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.22); }
body.has-mini .fab { bottom: 84px; }
body { padding-bottom: 72px; }
body.has-mini { padding-bottom: 140px; }
.drawer { position: fixed; z-index: 30; top: 0; right: 0; bottom: 0; width: min(440px, 100%); display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(0,0,0,.18); }
.drawer[hidden] { display: none; }
@media (max-width: 560px) { .drawer { top: 6vh; border-left: 0; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; } }
.dh { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.msgs { flex: 1; overflow-y: auto; padding: 14px; display: grid; gap: 12px; align-content: start; }
.msg { max-width: 94%; border-radius: 14px; padding: 10px 14px; font-size: 17px; line-height: 1.5; overflow-wrap: anywhere; }
.msg.me { justify-self: end; background: var(--accent); color: var(--accent-ink); }
.msg.bot { justify-self: start; background: var(--bg); border: 1px solid var(--line); }
.msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
.msg ul, .msg ol { margin: 4px 0 8px; padding-left: 22px; }
.msg pre { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; font-size: 14px; }
.msg code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88em; }
.msg .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.msg .opt { min-height: 44px; padding: 10px 12px; font-size: 16px; }
.msg .note { font-size: 14px; color: var(--muted); margin-top: 6px; }
.composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.composer textarea { flex: 1; resize: none; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 11px 12px; min-height: 48px; max-height: 140px; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.dots::after { content: "…"; display: inline-block; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.settings input[type=password], .settings input[type=text] { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }

/* podcast */
.eps { display: grid; gap: 8px; margin-top: 10px; }
.ep { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.ep.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.ep .hint { display: block; }
.make { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.make:first-of-type { border-top: 0; }
.make select, .make textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.make textarea { min-height: 120px; resize: vertical; }
.transport { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.transport .play { min-width: 120px; }
.transport select { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); min-height: 44px; }
#pchap { width: 100%; }
.transport select, .make select, .settings select { max-width: 100%; }
.tx { max-height: 46vh; overflow-y: auto; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 8px; }
.tx p { margin: 0; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 16px; }
.tx p .spk { color: var(--muted); font-weight: 700; margin-right: 6px; }
.tx p.cur { background: var(--accent-soft); }
.tx h4 { margin: 14px 8px 4px; font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.mini { position: fixed; left: 0; right: 0; bottom: 0; z-index: 14; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(0,0,0,.08); }
.mini[hidden] { display: none; }
.mini-t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 16px; }

/* competencies */
.chip.comp { font-weight: 700; }
.topics.sub { margin-top: 2px; }
.bp { display: grid; grid-template-columns: 70px 1fr; gap: 12px; align-items: center; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 14px 16px; margin-top: 10px; }
.bp:hover { border-color: var(--accent); }
.bp.top { box-shadow: inset 0 0 0 2px var(--accent); border-color: var(--accent); }
.bpw { font-size: 28px; font-weight: 700; line-height: 1; }
.bpb { display: grid; gap: 4px; }
.prog.sm { height: 8px; margin-top: 4px; }
.grp { margin: 28px 0 2px; }
.cres { padding: 10px 0; border-top: 1px solid var(--line); }
.cres:first-of-type { border-top: 0; }

/* dialogs */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; z-index: 40; }
.overlay .card { max-width: 460px; width: 100%; margin: 0; }
.pop { animation: pop .35s ease; }
@keyframes pop { 0% { transform: scale(.96); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
details.opts-panel summary { cursor: pointer; color: var(--muted); font-size: 15px; }
.settings { display: grid; gap: 12px; margin-top: 12px; }
.settings label { display: flex; justify-content: space-between; gap: 12px; align-items: center; font-size: 16px; }
.settings select { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
footer { color: var(--muted); font-size: 14px; margin-top: 40px; }
footer a { color: inherit; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><a href="#home">D426 Study</a> <small>Data Management Foundations</small></div>
    <span class="streak" id="streak" aria-live="polite"></span>
    <button class="pill" id="timerBtn" title="Focus sprint timer"></button>
  </div>
  <nav class="tabs" role="tablist" aria-label="Study modes">
    <button role="tab" data-tab="home">Start</button>
    <button role="tab" data-tab="competencies">Competencies</button>
    <button role="tab" data-tab="guide">Guide</button>
    <button role="tab" data-tab="learn">Learn</button>
    <button role="tab" data-tab="flash">Flashcards</button>
    <button role="tab" data-tab="test">Practice test</button>
    <button role="tab" data-tab="podcast">Podcast</button>
    <button role="tab" data-tab="cram">Cram sheet</button>
  </nav>
</header>
<main class="wrap" id="main"></main>
<div class="sr" aria-live="assertive" id="say"></div>

<!-- mini player: shows on other tabs while a podcast plays -->
<div class="mini" id="mini" hidden>
  <button class="btn small" id="miniPlay">Pause</button>
  <span class="mini-t" id="miniTitle"></span>
  <a class="btn ghost small" href="#podcast" style="text-decoration:none">Open</a>
</div>

<!-- Study Buddy -->
<button class="fab" id="askFab" aria-haspopup="dialog" aria-controls="askPanel">Ask</button>
<div class="drawer" id="askPanel" role="dialog" aria-modal="false" aria-labelledby="askTitle" hidden>
  <div class="dh">
    <b id="askTitle">Study Buddy</b>
    <span class="badge" id="askMode"></span>
    <button class="btn ghost small" id="askSettings" style="margin-left:auto">Settings</button>
    <button class="btn ghost small" id="askClose" aria-label="Close Study Buddy">Close</button>
  </div>
  <div class="msgs" id="askMsgs" aria-live="polite"></div>
  <form class="composer" id="askForm">
    <textarea id="askInput" rows="1" placeholder="Ask about any D426 topic or question" aria-label="Ask Study Buddy"></textarea>
    <button class="btn" type="submit">Send</button>
  </form>
</div>

<script src="data/cards.js?v=0a0c90b5"></script>
<script src="data/guide.js?v=0a0c90b5"></script>
<script src="data/podcast.js?v=0a0c90b5"></script>
<script>
(function () {
"use strict";
const D = window.D426;
const main = document.getElementById("main");
if (!D) { main.innerHTML = '<div class="card">Card data did not load. Make sure <code>data/cards.js</code> sits next to this page.</div>'; return; }

/* ---------- storage (never required) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("d426:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("d426:" + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const say = t => { const el = document.getElementById("say"); el.textContent = ""; setTimeout(() => { el.textContent = t; }, 30); };
const topicName = Object.fromEntries(D.topics.map(t => [t.id, t.name]));
const terms = D.terms.map(c => Object.assign({ id: c.t }, c));
const byId = Object.fromEntries(terms.map(c => [c.id, c]));
const comps = D.competencies;
const compById = Object.fromEntries(comps.map(c => [c.id, c]));
const compOfTopic = {}; comps.forEach(c => c.topics.forEach(t => { compOfTopic[t] = c.id; }));
const compOf = topic => compById[compOfTopic[topic]];
const byWeight = comps.slice().sort((a, b) => b.weight - a.weight);
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
const PRAISE = ["Nice.", "Got it.", "Yes!", "Locked in.", "Clean.", "That's it.", "Easy.", "Right on."];

/* ---------- state ---------- */
const G = window.D426_GUIDE || [];
const TABS = ["home", "competencies", "guide", "learn", "flash", "test", "podcast", "cram"];
const S = {
  tab: TABS.includes(store.get("tab", "home")) ? store.get("tab", "home") : "home",
  mod: null,
  done: store.get("done", {}),
  showPlan: false,
  topics: store.get("topics", []),
  settings: Object.assign({ round: 7, prompt: "def", typed: true, auto: true, front: "term" }, store.get("settings", {})),
  mastery: store.get("mastery", {}),
  streak: 0,
  best: store.get("best", 0)
};
const save = () => { store.set("settings", S.settings); store.set("mastery", S.mastery); store.set("topics", S.topics); store.set("tab", S.tab); };
const scoped = arr => S.topics.length ? arr.filter(x => S.topics.includes(x.topic)) : arr;
const lvl = id => S.mastery[id] || 0;
let L = null, F = null, T = null;

/* ---------- streak ---------- */
function bump(ok) {
  S.streak = ok ? S.streak + 1 : 0;
  if (S.streak > S.best) { S.best = S.streak; store.set("best", S.best); }
  drawStreak();
}
function drawStreak() {
  document.getElementById("streak").innerHTML = S.streak >= 2 ? `<b>${S.streak}</b> in a row` : (S.best ? `Best streak <b>${S.best}</b>` : "");
}

/* ---------- focus timer ---------- */
const TM = { mins: store.get("sprint", 15), end: null, iv: null };
const timerBtn = document.getElementById("timerBtn");
function drawTimer() {
  if (!TM.end) { timerBtn.textContent = `Start ${TM.mins}-min focus`; timerBtn.classList.remove("on"); document.title = "D426 Study"; return; }
  const left = Math.max(0, TM.end - Date.now());
  const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
  const txt = `${m}:${String(s).padStart(2, "0")}`;
  timerBtn.textContent = `${txt} left · stop`;
  timerBtn.classList.add("on");
  document.title = `${txt} · D426 Study`;
  if (left <= 0) { stopTimer(); breakTime(); }
}
function stopTimer() { clearInterval(TM.iv); TM.end = null; drawTimer(); }
function startSprint(mins) {
  TM.mins = mins; store.set("sprint", mins);
  TM.end = Date.now() + mins * 60000; clearInterval(TM.iv); TM.iv = setInterval(drawTimer, 1000); drawTimer();
}
timerBtn.addEventListener("click", () => {
  if (TM.end) { stopTimer(); return; }
  modal(`<h2>Focus sprint</h2><p class="hint">Pick a length. Work until the timer ends, then take a real break.</p>
    <div class="row" style="margin-top:12px">${[10, 15, 25].map(m => `<button class="btn ${m === TM.mins ? "" : "ghost"}" data-min="${m}">${m} min</button>`).join("")}</div>`,
    box => box.querySelectorAll("[data-min]").forEach(b => b.onclick = () => { startSprint(+b.dataset.min); closeModal(); }));
});
function breakTime() {
  modal(`<h2>Sprint done. Break time.</h2>
    <p>You focused for ${TM.mins} minutes. Take 5: stand up, drink water, look at something far away.</p>
    <div class="row actions"><button class="btn" id="again">Start another sprint</button><button class="btn ghost" id="later">Close</button></div>`,
    box => { box.querySelector("#again").onclick = () => { closeModal(); timerBtn.click(); }; box.querySelector("#later").onclick = closeModal; });
}

/* ---------- modal ---------- */
let modalEl = null;
function modal(html, wire) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "overlay";
  modalEl.innerHTML = `<div class="card pop" role="dialog" aria-modal="true">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  if (wire) wire(modalEl);
  const f = modalEl.querySelector("button"); if (f) f.focus();
}
function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } }

/* ---------- tabs & topic chips ---------- */
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab, b.dataset.tab === "guide" ? "" : undefined)));

/* ---------- routing: every view has its own link (#learn, #guide/05-keys-and-constraints) ---------- */
function go(tab, sub) {
  const h = "#" + tab + (sub ? "/" + sub : "");
  if (location.hash !== h) location.hash = h; else route();
}
function route() {
  const [tab, sub] = decodeURIComponent(location.hash.replace(/^#/, "")).split("/");
  if (TABS.includes(tab)) {
    S.tab = tab;
    if (tab === "guide") S.mod = G.some(m => m.id === sub) ? sub : null;
    else if (tab === "podcast" && sub) {  // #podcast/c3 picks that episode
      history.replaceState(null, "", "#podcast"); pickEpisode(sub);
    } else if (tab === "test" && sub === "sim") {
      history.replaceState(null, "", "#test"); save(); startSim(); window.scrollTo(0, 0); return;
    } else if (sub && (compById[sub] || topicName[sub])) {  // #learn/c3, #flash/joins
      S.topics = compById[sub] ? compById[sub].topics.slice() : [sub]; L = F = T = null;
      history.replaceState(null, "", "#" + tab);
    }
  }
  save(); render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
/* competency chips: All · C1 · C2 · C3, then that competency's topics to narrow down */
function focusComp() {
  if (!S.topics.length) return null;
  const c = compOfTopic[S.topics[0]];
  return S.topics.every(t => compOfTopic[t] === c) ? compById[c] : null;
}
function chips() {
  const fc = focusComp(), whole = fc && sameSet(S.topics, fc.topics);
  return `<div class="topics" role="group" aria-label="Competencies">
    <button class="chip" aria-pressed="${!S.topics.length}" data-topic="">All</button>
    ${comps.map(c => `<button class="chip comp" aria-pressed="${sameSet(S.topics, c.topics)}" data-comp="${c.id}">C${c.n} · ${c.weight}%</button>`).join("")}
  </div>` + (fc ? `<div class="topics sub" role="group" aria-label="Topics in competency ${fc.n}">
    ${fc.topics.map(t => `<button class="chip" aria-pressed="${!whole && S.topics.includes(t)}" data-topic="${t}">${esc(topicName[t])}</button>`).join("")}
  </div><div class="hint"><b style="color:var(--ink)">Competency ${fc.n}:</b> ${esc(fc.name)} · ${esc(fc.lessons)}${whole ? " · tap a topic to narrow" : ""}</div>`
    : `<div class="hint">Pick a competency. C${byWeight[0].n} is ${byWeight[0].weight}% of the exam, so it's the best place to start.</div>`);
}
function selLabel() {
  if (!S.topics.length) return "All competencies";
  const c = comps.find(x => sameSet(S.topics, x.topics));
  return c ? `Competency ${c.n} · ${c.weight}%` : S.topics.map(t => topicName[t]).join(", ");
}
function focusLine(label) {
  return `<div class="row spread focusline"><span class="hint">Studying: <b style="color:var(--ink)">${esc(label || selLabel())}</b></span><button class="btn ghost small" id="endsess">End session</button></div>`;
}
function wireEnd(reset) { const b = main.querySelector("#endsess"); if (b) b.onclick = () => { reset(); render(); }; }
function wireChips() {
  main.querySelectorAll("[data-comp]").forEach(b => b.onclick = () => {
    S.topics = compById[b.dataset.comp].topics.slice(); L = F = T = null; save(); render();
  });
  main.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => {
    const id = b.dataset.topic;
    if (!id) S.topics = [];
    else {
      const c = compOf(id);
      if (sameSet(S.topics, c.topics)) S.topics = [id];  // whole competency selected: first tap narrows to that topic
      else {
        S.topics = S.topics.includes(id) ? S.topics.filter(x => x !== id) : S.topics.concat(id);
        if (!S.topics.length) S.topics = c.topics.slice();
      }
    }
    L = F = T = null; save(); render();
  });
}
const compPool = c => terms.filter(t => compOfTopic[t.topic] === c.id);
const compMastery = c => { const p = compPool(c); return p.length ? p.filter(t => lvl(t.id) >= 2).length / p.length : 0; };
/* the competency with the most exam points still unmastered */
const mostAtStake = () => comps.slice().sort((a, b) => b.weight * (1 - compMastery(b)) - a.weight * (1 - compMastery(a)) || b.weight - a.weight)[0];

/* ---------- mastery bar ---------- */
function masteryBar(pool) {
  const n = pool.length || 1;
  const m = pool.filter(c => lvl(c.id) >= 2).length, f = pool.filter(c => lvl(c.id) === 1).length;
  return `<div class="prog" role="img" aria-label="${m} mastered, ${f} familiar, ${pool.length - m - f} not started"><span class="m" style="width:${m / n * 100}%"></span><span class="f" style="width:${f / n * 100}%"></span></div>
  <div class="legend"><span><i class="dot" style="background:var(--good)"></i>Mastered ${m}</span><span><i class="dot" style="background:var(--mid)"></i>Familiar ${f}</span><span><i class="dot" style="background:var(--line)"></i>New ${pool.length - m - f}</span></div>`;
}

/* =========================================================
   LEARN  (Quizlet-style: rounds, MC first, then typed)
   ========================================================= */
const typedOn = () => S.settings.typed && S.settings.prompt === "def";
function startRound() {
  const pool = scoped(terms).filter(c => lvl(c.id) < 2);
  if (!pool.length) { L = { finished: true }; render(); return; }
  const inProg = shuffle(pool.filter(c => lvl(c.id) === 1));
  const fresh = shuffle(pool.filter(c => lvl(c.id) === 0));
  const cards = inProg.concat(fresh).slice(0, S.settings.round);
  L = { cards, queue: shuffle(cards), asked: 0, len: cards.length, retry: {}, results: {}, cur: null, round: (L && L.round ? L.round : 0) + 1 };
  nextQ();
}
function options(card) {
  const same = shuffle(terms.filter(c => c.topic === card.topic && c.id !== card.id));
  const other = shuffle(terms.filter(c => c.topic !== card.topic));
  const wrong = same.concat(other).slice(0, 3);
  return shuffle([card].concat(wrong));
}
function nextQ() {
  if (!L.queue.length) { L.summary = true; L.cur = null; render(); return; }
  const card = L.queue.shift();
  const mode = lvl(card.id) >= 1 && typedOn() ? "type" : "mc";
  L.cur = { card, mode, opts: mode === "mc" ? options(card) : null, done: false, prev: lvl(card.id) };
  L.asked++;
  render();
}
function norm(s) { return String(s).toLowerCase().replace(/[^a-z0-9%_]/g, ""); }
function dist(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let p = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; }
  return p[n];
}
function accepted(card) {
  const out = [card.t, card.t.replace(/\s*\(.*?\)\s*/g, " ")];
  return out.concat(card.alts || []).map(norm).filter(Boolean);
}
function grade(card, given) {
  const g = norm(given); if (!g) return { ok: false };
  for (const a of accepted(card)) {
    if (a === g) return { ok: true, exact: true };
    const tol = a.length <= 4 ? 0 : a.length <= 9 ? 1 : 2;
    if (dist(a, g) <= tol) return { ok: true, exact: false };
  }
  return { ok: false };
}
function answer(ok, given) {
  const c = L.cur; if (c.done) return;
  c.done = true; c.ok = ok; c.given = given;
  const id = c.card.id;
  if (ok) { S.mastery[id] = Math.min(2, c.prev + 1); }
  else { S.mastery[id] = 0; if (!L.retry[id]) { L.retry[id] = true; L.queue.push(c.card); L.len++; c.requeued = true; } }
  L.results[id] = lvl(id) >= 2 ? "m" : ok ? "l" : "x";
  bump(ok); save(); render();
  say(ok ? "Correct" : "Incorrect. The answer is " + (S.settings.prompt === "def" ? c.card.t : c.card.d));
  if (ok && S.settings.auto) { const ref = c; setTimeout(() => { if (L && L.cur === ref && S.tab === "learn") nextQ(); }, 1100); }
}
function override() {
  const c = L.cur, id = c.card.id;
  S.mastery[id] = Math.min(2, c.prev + 1);
  if (c.requeued) { L.queue = L.queue.filter(x => x.id !== id); L.len--; L.retry[id] = false; }
  c.ok = true; c.overridden = true;
  L.results[id] = lvl(id) >= 2 ? "m" : "l";
  bump(true); save(); render();
}
function renderLearn() {
  const pool = scoped(terms);
  let h = (!L || L.finished ? chips() : focusLine()) + `<div class="card">${masteryBar(pool)}</div>`;
  if (!L) {
    const left = pool.filter(c => lvl(c.id) < 2).length;
    h += `<div class="card">
      <h1>Learn</h1>
      <p>Short rounds of ${S.settings.round}. Multiple choice first; once you know a card, you type the answer. Miss one and it comes back later in the round.</p>
      <p class="hint">${left} of ${pool.length} terms left to master in this selection.</p>
      <div class="row actions"><button class="btn" id="go">${left ? "Start round" : "All mastered: see results"}</button><span class="hint"><kbd>Enter</kbd> to start</span></div>
      <details class="opts-panel" style="margin-top:18px"><summary>Options</summary>
        <div class="settings">
          <label>Cards per round <select id="s-round">${[5, 7, 10].map(n => `<option ${n === S.settings.round ? "selected" : ""}>${n}</option>`).join("")}</select></label>
          <label>Show me the <select id="s-prompt"><option value="def" ${S.settings.prompt === "def" ? "selected" : ""}>definition, I answer the term</option><option value="term" ${S.settings.prompt === "term" ? "selected" : ""}>term, I answer the definition</option></select></label>
          <label>Typed answers after the first correct <input type="checkbox" id="s-typed" ${S.settings.typed ? "checked" : ""}></label>
          <label>Auto-advance when correct <input type="checkbox" id="s-auto" ${S.settings.auto ? "checked" : ""}></label>
          <div class="row"><button class="btn ghost small" id="s-reset">Reset Learn progress</button></div>
          <p class="hint" style="margin:0">Typed answers only apply when you're shown the definition.</p>
        </div>
      </details></div>`;
  } else if (L.finished) {
    h += `<div class="card pop"><h1>Everything here is mastered.</h1><p>${pool.length} terms in this selection. Lock it in with the practice test, or reset and run it again tomorrow morning.</p>
      <div class="row actions"><button class="btn" id="to-test">Take a practice test</button><button class="btn ghost" id="reset-sel">Reset this selection</button></div></div>`;
  } else if (L.summary) {
    const ids = Object.keys(L.results);
    const nm = ids.filter(i => L.results[i] === "m").length;
    h += `<div class="card pop"><div class="label">Round ${L.round} complete</div>
      <h1>${nm ? `${nm} newly mastered.` : "Progress made."} Keep going.</h1>
      <ul class="slist">${ids.map(i => `<li><span>${esc(i)}</span><span class="badge ${L.results[i]}">${{ m: "Mastered", l: "Familiar", x: "Still learning" }[L.results[i]]}</span></li>`).join("")}</ul>
      <div class="row actions"><button class="btn" id="next-round">Next round</button><button class="btn ghost" id="stop">Take a break</button><span class="hint"><kbd>Enter</kbd> next round</span></div></div>`;
  } else {
    const c = L.cur, card = c.card, showDef = S.settings.prompt === "def";
    const promptTxt = showDef ? card.d : card.t;
    const ans = x => showDef ? x.t : x.d;
    h += `<div class="card"><div class="row spread"><span class="label">${showDef ? "Definition" : "Term"} · ${esc(topicName[card.topic])}</span><span class="hint">${Math.min(L.asked, L.len)} / ${L.len}</span></div>
      <div class="prog" style="height:6px;margin:10px 0 14px"><span class="m" style="width:${(L.asked - (c.done ? 0 : 1)) / L.len * 100}%;background:var(--accent)"></span></div>
      <div class="prompt">${esc(promptTxt)}</div>`;
    if (c.mode === "mc") {
      h += `<div class="label" style="margin-bottom:8px">Choose the ${showDef ? "term" : "definition"}</div><div class="opts">` +
        c.opts.map((o, i) => {
          let cls = "";
          if (c.done) { if (o.id === card.id) cls = "right"; else if (o.id === c.given) cls = "wrong"; }
          return `<button class="opt ${cls}" data-opt="${i}" ${c.done ? "disabled" : ""}><span class="k">${i + 1}</span><span>${esc(ans(o))}</span></button>`;
        }).join("") + `</div>`;
      if (!c.done) h += `<div class="row actions"><span class="hint">Press <kbd>1</kbd>–<kbd>4</kbd></span><button class="btn ghost small" id="idk" style="margin-left:auto">Don't know</button></div>`;
    } else {
      h += `<div class="label" style="margin-bottom:8px">Type the term</div>
        <input class="answer" id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Your answer" ${c.done ? `disabled value="${esc(c.given || "")}"` : ""}>`;
      if (!c.done) h += `<div class="row actions"><button class="btn" id="submit">Answer</button><button class="btn ghost" id="idk">Don't know</button><span class="hint"><kbd>Enter</kbd> to answer</span></div>`;
    }
    if (c.done) {
      if (c.ok) {
        const mastered = lvl(card.id) >= 2;
        const fuzzy = c.mode === "type" && c.close;
        h += `<div class="fb good pop"><strong>${c.overridden ? "Counted as correct." : mastered ? "Mastered!" : pick(PRAISE)}</strong>${fuzzy ? `<div class="why">Close enough. Exact term: <b>${esc(card.t)}</b></div>` : ""}</div>`;
      } else {
        h += `<div class="fb bad pop"><strong>Not quite. It's coming back later this round.</strong><div>Answer: <b>${esc(ans(card))}</b></div>${c.mode === "type" && c.given ? `<div class="why">You wrote: ${esc(c.given)}</div>` : ""}</div>`;
      }
      h += `<div class="row actions"><button class="btn" id="cont">Continue</button>${!c.ok && c.mode === "type" && c.given ? `<button class="btn ghost" id="override">I was right</button>` : ""}<button class="btn ghost" id="lexplain">Explain</button><span class="hint"><kbd>Enter</kbd> continue</span></div>`;
    }
    h += `</div>`;
  }
  main.innerHTML = h; wireChips(); wireEnd(() => { L = null; });
  const $ = id => main.querySelector("#" + id);
  if ($("go")) $("go").onclick = () => { startRound(); };
  if ($("s-round")) {
    $("s-round").onchange = e => { S.settings.round = +e.target.value; save(); };
    $("s-prompt").onchange = e => { S.settings.prompt = e.target.value; save(); render(); };
    $("s-typed").onchange = e => { S.settings.typed = e.target.checked; save(); };
    $("s-auto").onchange = e => { S.settings.auto = e.target.checked; save(); };
    $("s-reset").onclick = () => { if (confirm("Reset all Learn progress?")) { S.mastery = {}; save(); render(); } };
  }
  if ($("to-test")) $("to-test").onclick = () => { L = null; go("test"); };
  if ($("reset-sel")) $("reset-sel").onclick = () => { scoped(terms).forEach(c => delete S.mastery[c.id]); L = null; save(); render(); };
  if ($("next-round")) { $("next-round").onclick = () => startRound(); $("next-round").focus(); }
  if ($("stop")) $("stop").onclick = () => { L = null; render(); };
  main.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => { const o = L.cur.opts[+b.dataset.opt]; answer(o.id === L.cur.card.id, o.id); });
  if ($("idk")) $("idk").onclick = () => answer(false, "");
  if ($("submit")) $("submit").onclick = submitTyped;
  if ($("cont")) { $("cont").onclick = nextQ; $("cont").focus(); }
  if ($("lexplain")) $("lexplain").onclick = () => askExplainTerm(L.cur.card);
  if ($("override")) $("override").onclick = override;
  if ($("typed") && !L.cur.done) $("typed").focus();
}
function submitTyped() {
  const v = main.querySelector("#typed").value;
  if (!v.trim()) return;
  const r = grade(L.cur.card, v);
  L.cur.close = r.ok && !r.exact;
  answer(r.ok, v);
}

/* =========================================================
   FLASHCARDS  (flip, sort into Know / Still learning)
   ========================================================= */
const newFlash = ids => ({ ids: ids || shuffle(scoped(terms).map(c => c.id)), i: 0, flipped: false, know: [], learning: [] });
function startFlash(ids) { F = newFlash(ids); render(); }
function flashMark(knows) {
  const id = F.ids[F.i];
  (knows ? F.know : F.learning).push(id);
  if (knows && lvl(id) < 1) { S.mastery[id] = 1; save(); }
  F.i++; F.flipped = false; render();
}
function renderFlash() {
  if (!F) F = newFlash();
  let h = chips();
  if (F.i >= F.ids.length) {
    h += `<div class="card pop"><h1>Deck done.</h1><p><b>${F.know.length}</b> know it · <b>${F.learning.length}</b> still learning</p>
      <div class="row actions">${F.learning.length ? `<button class="btn" id="redo">Review the ${F.learning.length} I'm still learning</button>` : ""}<button class="btn ${F.learning.length ? "ghost" : ""}" id="restart">Shuffle and restart</button></div></div>`;
  } else {
    const c = byId[F.ids[F.i]], frontTerm = S.settings.front === "term";
    h += `<div class="row spread" style="margin-top:16px"><span class="hint">${F.i + 1} / ${F.ids.length} · know ${F.know.length} · learning ${F.learning.length}</span>
      <button class="btn ghost small" id="side">Front: ${frontTerm ? "term" : "definition"}</button></div>

/* =========================================================
   PRACTICE TEST  (multiple choice, instant feedback)
   ========================================================= */
function startTest(n, qs, sim) {
  const pool = qs || shuffle(scoped(D.questions));
  const list = pool.slice(0, n || pool.length).map(q => {
    const order = shuffle([0, 1, 2, 3]);
    return { q, order, a: order.indexOf(q.a), ok: null };
  });
  T = { list, i: 0, picked: null, right: 0, missed: [], sim: !!sim };
  render();
}
/* exam simulation: split questions by competency weight (largest-remainder rounding) */
const SIM_N = 30;
function simAlloc(n) {
  const a = comps.map(c => ({ c, exact: n * c.weight / 100 }));
  a.forEach(x => { x.k = Math.floor(x.exact); });
  let left = n - a.reduce((s, x) => s + x.k, 0);
  a.slice().sort((x, y) => (y.exact - y.k) - (x.exact - x.k)).forEach(x => { if (left > 0) { x.k++; left--; } });
  return a;
}
function startSim() {
  const qs = simAlloc(SIM_N).flatMap(x => shuffle(D.questions.filter(q => compOfTopic[q.topic] === x.c.id)).slice(0, x.k));
  startTest(0, shuffle(qs), true);
}
function compResults() {
  const rows = comps.map(c => {
    const items = T.list.filter(it => compOfTopic[it.q.topic] === c.id);
    return { c, n: items.length, right: items.filter(it => it.ok).length };
  }).filter(r => r.n);
  const weakest = rows.length > 1 ? rows.slice().sort((a, b) => a.right / a.n - b.right / b.n || b.c.weight - a.c.weight)[0] : null;
  return `<h3 style="margin-top:18px">By competency</h3>` + rows.map(r => {
    const p = Math.round(r.right / r.n * 100);
    return `<div class="cres"><div class="row spread"><b>C${r.c.n} · ${r.c.weight}% of exam</b><span>${r.right}/${r.n} (${p}%)</span></div>
      <div class="hint">${esc(r.c.name)}</div><div class="prog sm"><span class="m" style="width:${p}%"></span></div></div>`;
  }).join("") + (weakest ? `<div class="fb bad" style="margin-top:14px"><strong>Focus next: Competency ${weakest.c.n}</strong><div class="row" style="margin-top:8px"><button class="btn small" id="learnweak" data-c="${weakest.c.id}">Learn C${weakest.c.n} now</button></div></div>` : "");
}
function renderTest() {
  let h = !T ? "" : focusLine(T.sim ? "Exam simulation" : null);
  const pool = scoped(D.questions);
  if (!T) {
    const alloc = simAlloc(SIM_N);
    h += `<div class="card"><h1>Practice test</h1>
      <h3 style="margin-top:14px">Exam simulation</h3>
      <p style="margin-top:0">${SIM_N} questions split like the real exam: ${alloc.map(x => `${x.k} from C${x.c.n}`).join(", ")}. Scored by competency, so you see where to focus.</p>
      <div class="row"><button class="btn" id="sim">Start exam simulation</button><span class="hint">about 15 min</span></div></div>
      <div class="card"><h3>Or practice one area</h3>${chips()}
      <div class="row actions">${[10, 20].filter(n => n < pool.length).map(n => `<button class="btn ${n === 10 ? "" : "ghost"}" data-n="${n}">${n} questions</button>`).join("")}<button class="btn ${pool.length <= 10 ? "" : "ghost"}" data-n="0">All ${pool.length}</button></div></div>`;
  } else if (T.i >= T.list.length) {
    const pct = Math.round(T.right / T.list.length * 100);
    if (!T.saved) {  // remember results for the Competencies tab and the podcast's "missed questions" episode
      T.saved = true;
      store.set("missed", T.missed.map(m => m.q.q));
      if (T.sim) {
        const by = {};
        comps.forEach(c => { const it = T.list.filter(x => compOfTopic[x.q.topic] === c.id); by[c.id] = [it.filter(x => x.ok).length, it.length]; });
        store.set("sims", [{ at: Date.now(), right: T.right, n: T.list.length, by }].concat(store.get("sims", [])).slice(0, 10));
      }
    }
    h += `<div class="card pop"><div class="label">${T.sim ? "Exam simulation results" : "Results"}</div><h1>${T.right} / ${T.list.length} (${pct}%)</h1>
      <p>${pct >= 85 ? "Strong. You're ready for these topics." : pct >= 65 ? "Solid base. Review the misses below, then retry them." : "Good data. Go back to Learn on the weakest competency, then retry."}</p>
      ${compResults()}
      ${T.missed.length ? `<h3 style="margin-top:18px">Review these</h3><ul class="slist">${T.missed.map(m => `<li style="display:block"><div>${esc(m.q.q)}</div><div class="hint">C${compOf(m.q.topic).n} · Answer: <b style="color:var(--ink)">${esc(m.q.o[m.q.a])}</b> · ${esc(m.q.e)}</div></li>`).join("")}</ul>` : ""}
      <div class="row actions">${T.missed.length ? `<button class="btn" id="retry">Retry the ${T.missed.length} I missed</button>` : ""}<button class="btn ${T.missed.length ? "ghost" : ""}" id="newtest">New test</button></div></div>`;
  } else {
    const it = T.list[T.i], q = it.q, done = T.picked !== null;
    h += `<div class="card"><div class="row spread"><span class="label">C${compOf(q.topic).n} · ${esc(topicName[q.topic])}</span><span class="hint">${T.i + 1} / ${T.list.length} · ${T.right} right</span></div>
      <div class="prog" style="height:6px;margin:10px 0 14px"><span class="m" style="width:${T.i / T.list.length * 100}%;background:var(--accent)"></span></div>
      <div class="prompt">${esc(q.q)}</div><div class="opts">` +
      it.order.map((oi, i) => {
        let cls = ""; if (done) { if (i === it.a) cls = "right"; else if (i === T.picked) cls = "wrong"; }
        return `<button class="opt ${cls}" data-pick="${i}" ${done ? "disabled" : ""}><span class="k">${i + 1}</span><span>${esc(q.o[oi])}</span></button>`;
      }).join("") + `</div>`;
    if (done) {
      const ok = T.picked === it.a;
      h += `<div class="fb ${ok ? "good" : "bad"} pop"><strong>${ok ? pick(PRAISE) : "Not this time."}</strong><div class="why">${esc(q.e)}</div></div>
        <div class="row actions"><button class="btn" id="tnext">${T.i + 1 < T.list.length ? "Next question" : "See results"}</button><button class="btn ghost" id="texplain">Explain this</button><span class="hint"><kbd>Enter</kbd></span></div>`;
    } else h += `<p class="hint" style="margin-top:14px">Press <kbd>1</kbd>–<kbd>4</kbd></p>`;
    h += `</div>`;
  }
  main.innerHTML = h; wireChips(); wireEnd(() => { T = null; });
  const $ = id => main.querySelector("#" + id);
  main.querySelectorAll("[data-n]").forEach(b => b.onclick = () => startTest(+b.dataset.n));
  main.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => testPick(+b.dataset.pick));
  if ($("tnext")) { $("tnext").onclick = () => { T.i++; T.picked = null; render(); }; $("tnext").focus(); }
  if ($("retry")) $("retry").onclick = () => startTest(0, shuffle(T.missed.map(m => m.q)));
  if ($("newtest")) $("newtest").onclick = () => { T = null; render(); };
  if ($("sim")) $("sim").onclick = startSim;
  if ($("texplain")) $("texplain").onclick = () => { const it = T.list[T.i]; askExplainQuestion(it.q, it.order[T.picked]); };
  if ($("learnweak")) $("learnweak").onclick = e => { S.topics = compById[e.currentTarget.dataset.c].topics.slice(); L = F = T = null; save(); go("learn"); };
}
function testPick(i) {
  if (!T || T.picked !== null) return;
  const it = T.list[T.i]; T.picked = i;
  const ok = i === it.a; it.ok = ok;
  if (ok) T.right++; else T.missed.push(it);
  bump(ok); render(); say(ok ? "Correct" : "Incorrect");
}

async function claudeStream(system, messages, onText) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "content-type": "application/json", "x-api-key": AI.key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify({ model: AI.model, max_tokens: 700, system, messages, stream: true })

  if (!res.ok) { let msg = ""; try { msg = (await res.json()).error.message; } catch (e) {} const err = new Error(msg || `HTTP ${res.status}`); err.status = res.status; throw err; }

  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const evt = buf.slice(0, i); buf = buf.slice(i + 2);
      const data = evt.split("\n").filter(l => l.startsWith("data:")).map(l => l.slice(5).trim()).join("");
      if (!data) continue;
      let j; try { j = JSON.parse(data); } catch (e) { continue; }
      if (j.type === "content_block_delta" && j.delta && j.delta.type === "text_delta") { full += j.delta.text; onText(full); }
      else if (j.type === "error") throw new Error((j.error && j.error.message) || "Stream error");

  const inline = x => x.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,!?:;]|$)/g, "$1<i>$2</i>");
  let html = "", list = null, code = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  esc(s).split("\n").forEach(ln => {
    if (/^\s*```/.test(ln)) { if (code) { html += `<pre><code>${code.join("\n")}</code></pre>`; code = null; } else { close(); code = []; } return; }
    if (code) { code.push(ln); return; }
    const li = ln.match(/^\s*([-*•]|\d+\.)\s+(.*)/);
    if (li) { const tag = /\d/.test(li[1]) ? "ol" : "ul"; if (list !== tag) { close(); html += `<${tag}>`; list = tag; } html += `<li>${inline(li[2])}</li>`; return; }
    close();
    if (/^#{1,4}\s/.test(ln)) html += `<p><b>${inline(ln.replace(/^#+\s*/, ""))}</b></p>`;
    else if (ln.trim()) html += `<p>${inline(ln)}</p>`;
  });
  close(); if (code) html += `<pre><code>${code.join("\n")}</code></pre>`;
  return html;
}

/* --- chat UI --- */
function drawAsk() {
  document.getElementById("askMode").textContent = AI.key ? "Claude" : "Course notes";
  document.getElementById("askMode").className = "badge " + (AI.key ? "m" : "l");
  askMsgs.innerHTML = ASK.msgs.length ? ASK.msgs.map((m, i) => `<div class="msg ${m.role === "user" ? "me" : "bot"}" data-i="${i}">${m.role === "user" ? esc(m.text) : m.html}</div>`).join("")
    : `<div class="msg bot"><p><b>Hi, I'm Study Buddy.</b> Ask me about any D426 topic, compare two terms, or paste a practice question.</p>
       <div class="sugg">${["What's a weak entity?", "WHERE vs HAVING", "Explain 3NF simply", "Quiz me on C3", "Difference between candidate key and primary key"].map(s => `<button class="tag" data-act="ask" data-q="${esc(s)}">${esc(s)}</button>`).join("")}</div>
       <p class="note">${AI.key ? "Claude mode is on." : "Answers come from the course notes on this site. Turn on Claude in Settings for open-ended questions."}</p></div>`;
  askMsgs.scrollTop = askMsgs.scrollHeight;
}
function openAsk(prefill, payload) {
  ASK.open = true; askPanel.hidden = false; document.getElementById("askFab").setAttribute("aria-expanded", "true");
  drawAsk();
  if (payload) sendAsk(payload);
  else if (prefill) { askInput.value = prefill; }
  setTimeout(() => askInput.focus(), 50);
}
function closeAsk() { ASK.open = false; askPanel.hidden = true; document.getElementById("askFab").setAttribute("aria-expanded", "false"); document.getElementById("askFab").focus(); }
document.getElementById("askFab").onclick = () => ASK.open ? closeAsk() : openAsk();
document.getElementById("askClose").onclick = closeAsk;
document.getElementById("askForm").onsubmit = e => { e.preventDefault(); const v = askInput.value.trim(); if (v && !ASK.busy) { askInput.value = ""; sendAsk({ text: v }); } };
askInput.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("askForm").requestSubmit(); } });
function askExplainTerm(t) { openAsk(null, { text: `Explain: ${t.t}`, term: t }); }
function askExplainQuestion(q, picked) { openAsk(null, { text: `Explain this question: ${q.q}`, question: q, picked }); }
async function sendAsk(p) {
  ASK.msgs.push({ role: "user", text: p.text }); ASK.hist.push({ role: "user", content: p.text });
  let local;
  if (p.question) local = explainQuestionLocal(p.question, p.picked);
  else if (p.term) { const mod = moduleOfTopic(p.term.topic); local = { html: termCard(p.term) + (mod ? `<p class="note">Read more: ${modLink(mod)}</p>` : "") + acts([actQuiz(p.term.topic), actListen()]), text: `${p.term.t}: ${p.term.d}` }; }
  else local = localAnswer(p.text);
  const isQuiz = !!local.scope;
  if (!AI.key || isQuiz) {
    ASK.msgs.push({ role: "bot", html: local.html, text: local.text }); ASK.hist.push({ role: "assistant", content: local.text }); drawAsk(); return;
  }
  // Claude mode: stream an answer grounded in the notes
  let extra = "";
  if (p.question) { const q = p.question; extra = `The student wants this practice question explained.\nQuestion: ${q.q}\nOptions: ${q.o.map((o, i) => `${LETTERS[i]}. ${o}`).join("; ")}\nCorrect: ${LETTERS[q.a]}. ${q.o[q.a]}\nCourse explanation: ${q.e}` + (p.picked != null && p.picked !== q.a ? `\nThe student picked ${LETTERS[p.picked]}. ${q.o[p.picked]}. Explain briefly why that's wrong.` : ""); }
  if (p.term) extra = `The student wants this term explained simply, with an example and how it could show up on the exam.\nTerm: ${p.term.t}\nCourse definition: ${p.term.d}`;
  const ctx = contextFor(p.question ? p.question.q : p.term ? p.term.t : p.text, extra);
  const msg = { role: "bot", html: `<p class="dots">Thinking</p>`, text: "" };
  ASK.msgs.push(msg); ASK.busy = true; drawAsk();
  const el = () => askMsgs.querySelector(`.msg[data-i="${ASK.msgs.indexOf(msg)}"]`);
  const history = ASK.hist.slice(-9, -1).concat([{ role: "user", content: `${p.text}\n\n<notes>\n${ctx}\n</notes>` }]);
  try {
    const out = await claudeStream(SYSTEM(), history, full => { msg.html = md(full); const e = el(); if (e) { e.innerHTML = msg.html; askMsgs.scrollTop = askMsgs.scrollHeight; } });
    msg.text = out; msg.html = md(out) + acts([p.question || p.term ? actQuiz((p.question || p.term).topic) : "", actListen()]);
    ASK.hist.push({ role: "assistant", content: out });
  } catch (err) {
    const why = err.status === 401 ? "That API key didn't work. Check it in Settings." : err.status === 429 || err.status === 529 ? "Claude is busy right now." : err.status === 404 ? `The model "${esc(AI.model)}" wasn't found. Pick another in Settings.` : `Couldn't reach Claude (${esc(err.message)}).`;
    msg.html = `<p class="note">${why} Here's the answer from the course notes instead:</p>` + local.html; msg.text = local.text;
    ASK.hist.push({ role: "assistant", content: local.text });
  }
  ASK.busy = false; drawAsk();
}
askMsgs.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "ask") sendAsk({ text: b.dataset.q });
  else if (act === "quiz") { const m = quizMsg(b.dataset.scope || "all"); ASK.msgs.push({ role: "bot", html: m.html, text: m.text }); drawAsk(); }
  else if (act === "answer") {
    const q = D.questions[+b.dataset.qid], i = +b.dataset.pick, box = askMsgs.querySelector("#" + b.dataset.box); if (!box || box.dataset.done) return;
    box.dataset.done = "1";
    box.querySelectorAll(".opt").forEach((o, k) => { o.disabled = true; if (k === q.a) o.classList.add("right"); else if (k === i) o.classList.add("wrong"); });
    const ok = i === q.a; bump(ok);
    const note = `<div class="fb ${ok ? "good" : "bad"}" style="margin-top:8px"><strong>${ok ? pick(PRAISE) : `It's ${LETTERS[q.a]}.`}</strong><div class="why">${esc(q.e)}</div></div>` + acts([`<button class="btn small" data-act="quiz" data-scope="${q.topic}">Another one</button>`, ok ? "" : `<button class="btn ghost small" data-act="explainq" data-qid="${D.questions.indexOf(q)}" data-pick="${i}">Explain</button>`]);
    box.insertAdjacentHTML("afterend", note);
    const holder = box.closest(".msg"), idx = +holder.dataset.i; ASK.msgs[idx].html = holder.innerHTML;
  } else if (act === "explainq") sendAsk({ text: `Explain this question: ${D.questions[+b.dataset.qid].q}`, question: D.questions[+b.dataset.qid], picked: +b.dataset.pick });
  else if (act === "listen") {
    const holder = b.closest(".msg"), m = ASK.msgs[+holder.dataset.i];
    if (!hasSpeech) return;
    if (speechSynthesis.speaking) { speechSynthesis.cancel(); return; }
    if (P.playing) podPause();
    const u = new SpeechSynthesisUtterance(speakable(m.text)), v = voiceFor("A"); if (v) u.voice = v; u.rate = P.rate; speechSynthesis.speak(u);
  }
});
document.getElementById("askSettings").onclick = () => {
  modal(`<h2>Study Buddy settings</h2>
    <p style="margin-top:0">Without setup, answers come from this site's course notes. For open-ended questions, connect Claude with your own Anthropic API key.</p>
    <div class="settings">
      <label style="display:block">Anthropic API key<input type="password" id="aiKey" placeholder="sk-ant-..." autocomplete="off" value="${esc(AI.key)}" style="margin-top:6px"></label>
      <label>Model <select id="aiModel">${[["claude-haiku-5-5", "Claude Haiku 5.5 (fast)"], ["claude-sonnet-5-5", "Claude Sonnet 5.5 (deeper)"]].map(([v, l]) => `<option value="${v}" ${v === AI.model ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label>Remember on this device <input type="checkbox" id="aiRemember" ${AI.remember ? "checked" : ""}></label>
      <p class="hint" style="margin:0">Your key is sent only to api.anthropic.com and billed to your account. Without "Remember", it's forgotten when you close the tab. Get a key at console.anthropic.com and set a low spend limit.</p>
    </div>
    <div class="row actions"><button class="btn" id="aiSave">Save</button>${AI.key ? `<button class="btn ghost" id="aiRemove">Remove key</button>` : ""}<button class="btn ghost" id="aiCancel">Cancel</button></div>`,
    box => {
      const $b = id => box.querySelector("#" + id);
      const persist = () => {
        store.set("aiModel", AI.model);
        if (AI.remember && AI.key) store.set("aiKey", AI.key); else { try { localStorage.removeItem("d426:aiKey"); } catch (e) {} }
        try { if (AI.key) sessionStorage.setItem("d426:aiKey", AI.key); else sessionStorage.removeItem("d426:aiKey"); } catch (e) {}
      };
      $b("aiSave").onclick = () => { AI.key = $b("aiKey").value.trim(); AI.model = $b("aiModel").value; AI.remember = $b("aiRemember").checked; persist(); closeModal(); drawAsk(); };
      if ($b("aiRemove")) $b("aiRemove").onclick = () => { AI.key = ""; AI.remember = false; persist(); closeModal(); drawAsk(); };
      $b("aiCancel").onclick = closeModal;
    });
};

/* shared buttons that can appear on any page: data-ask, data-listen */
function wireShared() {
  main.querySelectorAll("[data-ask]").forEach(b => b.onclick = () => openAsk(null, { text: b.dataset.ask }));
  main.querySelectorAll("[data-listen]").forEach(b => b.onclick = () => pickEpisode(b.dataset.listen, null, false));
}

/* ---------- render ---------- */
function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
  ({ home: renderHome, competencies: renderComps, guide: renderGuide, learn: renderLearn, flash: renderFlash, test: renderTest, podcast: renderPodcast, cram: renderCram }[S.tab] || renderHome)();
  wireShared();
  podUI();
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (modalEl) closeModal(); else if (ASK.open) closeAsk(); return; }
  if (modalEl || ASK.open || e.metaKey || e.ctrlKey || e.altKey) return;
  const inInput = e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA";
  const num = /^[1-4]$/.test(e.key) ? +e.key - 1 : -1;
  if (S.tab === "learn") {
    if (!L) { if (e.key === "Enter" && !inInput && e.target.tagName !== "BUTTON" && e.target.tagName !== "SUMMARY") { e.preventDefault(); startRound(); } return; }
    if (L.summary) { if (e.key === "Enter" && e.target.tagName !== "BUTTON") { e.preventDefault(); startRound(); } return; }
    const c = L.cur; if (!c) return;
    if (!c.done && c.mode === "mc" && num >= 0 && !inInput) { e.preventDefault(); const o = c.opts[num]; answer(o.id === c.card.id, o.id); }
    else if (!c.done && c.mode === "type" && e.key === "Enter" && inInput) { e.preventDefault(); submitTyped(); }
    else if (c.done && e.key === "Enter" && e.target.tagName !== "BUTTON") { e.preventDefault(); nextQ(); }
  } else if (S.tab === "flash" && F && F.i < F.ids.length && !inInput) {
    if (e.key === " ") { e.preventDefault(); F.flipped = !F.flipped; const el = main.querySelector("#flip"); if (el) el.classList.toggle("flipped", F.flipped); }
    else if (e.key === "1") flashMark(false);
    else if (e.key === "2") flashMark(true);
    else if (e.key === "ArrowRight") { F.i = Math.min(F.ids.length, F.i + 1); F.flipped = false; render(); }
    else if (e.key === "ArrowLeft") { F.i = Math.max(0, F.i - 1); F.flipped = false; render(); }
  } else if (S.tab === "test" && T && T.i < T.list.length && !inInput) {
    if (T.picked === null && num >= 0) { e.preventDefault(); testPick(num); }
    else if (T.picked !== null && e.key === "Enter" && e.target.tagName !== "BUTTON") { e.preventDefault(); T.i++; T.picked = null; render(); }
  }
});

drawTimer(); drawStreak();
if (location.hash.length > 1) route(); else render();
})();
</script>
